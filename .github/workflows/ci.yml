name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run PWA & Service Worker Tests
      run: npx tsx src/lib/__tests__/pwa-verification.test.ts

    - name: Run Dialysis & Patient Feature Tests
      run: npx tsx src/lib/__tests__/patient-features.test.ts

    - name: Run Patient Messaging Tests
      run: npx tsx src/lib/__tests__/patient-messaging.test.ts

    - name: Type check (TypeScript)
      run: npx tsc --noEmit

    - name: Run ESLint
      run: npm run lint

    - name: Build Next.js
      run: npm run build
