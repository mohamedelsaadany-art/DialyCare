name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run All Automated Test Suites
      run: npm test

    - name: Type check (TypeScript)
      run: npx tsc --noEmit

    - name: Run ESLint
      run: npm run lint

    - name: Build Next.js
      run: npm run build
