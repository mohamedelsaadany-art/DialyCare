<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e6bb8"/>
      <stop offset="50%" stop-color="#1a5ea3"/>
      <stop offset="100%" stop-color="#0f3e6d"/>
    </linearGradient>

    <!-- Radial Glow behind kidneys -->
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e6bb8" stop-opacity="0"/>
    </radialGradient>

    <!-- Droplet Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Kidney Left Gradient -->
    <linearGradient id="kidneyL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Kidney Right Gradient -->
    <linearGradient id="kidneyR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#041e3d" flood-opacity="0.4"/>
    </filter>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#059669" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable compatibility -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Radial depth glow -->
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Subtle medical circular rings (inside safe zone) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#34d399" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Main Medical Graphic (Safe Zone: 51 to 461) -->
  <g filter="url(#shadow)">
    <!-- Cardio-Renal Embrace / Heart Ribbon -->
    <path d="M 256 405 C 248 398, 118 298, 118 198 C 118 135, 168 96, 224 96 C 242 96, 251 104, 256 112 C 261 104, 270 96, 288 96 C 344 96, 394 135, 394 198 C 394 298, 264 398, 256 405 Z"
          fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>

    <!-- Left Kidney Silhouette -->
    <!-- Anatomical bean shape with inward medial hilum -->
    <path d="M 188 140 C 132 140, 96 190, 96 256 C 96 325, 138 368, 184 368 C 220 368, 228 344, 222 304 C 216 268, 212 250, 220 216 C 228 180, 222 140, 188 140 Z"
          fill="url(#kidneyL)" stroke="#e0f2fe" stroke-width="2"/>

    <!-- Right Kidney Silhouette -->
    <path d="M 324 140 C 380 140, 416 190, 416 256 C 416 325, 374 368, 328 368 C 292 368, 284 344, 290 304 C 296 268, 300 250, 292 216 C 284 180, 290 140, 324 140 Z"
          fill="url(#kidneyR)" stroke="#e0f2fe" stroke-width="2"/>

    <!-- ECG Lifeline connecting kidneys behind droplet -->
    <path d="M 116 264 L 158 264 L 170 236 L 184 288 L 198 250 L 208 264 L 230 264"
          fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M 282 264 L 304 264 L 314 240 L 328 290 L 342 244 L 354 264 L 396 264"
          fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <!-- Central Fluid Droplet (Hemodialysis purification & balance) -->
    <g filter="url(#dropGlow)">
      <path d="M 256 122 C 256 122, 172 238, 172 296 C 172 342, 210 380, 256 380 C 302 380, 340 342, 340 296 C 340 238, 256 122, 256 122 Z"
            fill="url(#dropGrad)"/>
    </g>

    <!-- Droplet internal highlight reflection -->
    <path d="M 226 235 C 208 262, 202 286, 202 308 C 196 298, 194 276, 208 248 C 218 230, 230 216, 236 210 C 230 220, 228 228, 226 235 Z"
          fill="#ffffff" opacity="0.45"/>

    <!-- Medical Cross inside Droplet -->
    <g fill="#ffffff">
      <!-- Vertical bar of cross -->
      <rect x="244" y="244" width="24" height="82" rx="7"/>
      <!-- Horizontal bar of cross -->
      <rect x="215" y="273" width="82" height="24" rx="7"/>
    </g>

    <!-- Subtle dialysis filter flow dots -->
    <circle cx="256" cy="350" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="238" cy="342" r="3.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="274" cy="342" r="3.5" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
